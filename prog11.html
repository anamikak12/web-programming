
<!DOCTYPE html>
<html>
<head>
<title>Online Examination</title>
<style>
body {
    font-family: Arial;
    background: #eee;
    padding: 20px;
}
.box {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}
h1 {
    text-align: center;
    color: blue;
}
.question {
    background: #f2f2f2;
    padding: 12px;
    margin: 10px 0;
    border-radius: 5px;
}
label {
    display: block;
    margin: 8px;
}
button {
    background: blue;
    color: white;
    padding: 10px 20px;
    border: 0;
    cursor: pointer;
}
#result {
    text-align: center;
    color: green;
    font-size: 20px;
    margin-top: 20px;
}
</style>
</head>
<body>
<div class="box">
<h1>Online Examination</h1>
<h3>Subject: Computer Science</h3>
<p>Total Questions: 10 | Total Marks: 10</p>
<hr>
<form id="exam"></form>
<button type="button" onclick="submitExam()">
Submit Exam
</button>
<div id="result"></div>
</div>
<script>
let questions = [
["What does HTML stand for?",
["Hyper Text Markup Language","High Text Machine Language","Hyperlinks Text Mark Language","Home Tool Markup Language"],0],
["Which is used for web styling?",
["Java","CSS","Python","C++"],1],
["Which is a scripting language?",
["JavaScript","HTML","SQL","CSS"],0],
["Which tag creates a hyperlink?",
["<p>","<h1>","<a>","<br>"],2],
["Who developed Java originally?",
["Microsoft","Sun Microsystems","Google","IBM"],1],
["Single line comment in JavaScript?",
["<!-- -->","**","//","##"],2],
["Which tag displays an image?",
["<image>","<img>","<picture>","<src>"],1],
["Which declares a variable in JavaScript?",
["int","string","var","define"],2],
["Which language retrieves database data?",
["HTML","SQL","CSS","XML"],1],
["Which function displays a message box?",
["print()","display()","alert()","show()"],2]
];
let form = document.getElementById("exam");
questions.forEach((q,i)=>{
    let div = document.createElement("div");
    div.className = "question";
    let title = document.createElement("b");
    title.textContent = (i+1) + ". " + q[0];
    div.appendChild(title);
    q[1].forEach((op,j)=>{
        let label = document.createElement("label");
        let input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + i;
        input.value = j;
        label.appendChild(input);
        label.appendChild(document.createTextNode(" " + op));
        div.appendChild(label);
    });
    form.appendChild(div);
});
function submitExam(){
    let score = 0;
    questions.forEach((q,i)=>{
        let ans = document.querySelector(
            `input[name="q${i}"]:checked`
        );
        if(ans && Number(ans.value) === q[2]){
            score++;
        }
    });
    let percentage = score * 10;
    let message = "";
    if(percentage >= 80)
        message = "Excellent Performance!";
    else if(percentage >= 50)
        message = "Good Performance!";
    else
        message = "Need More Practice!";
    document.getElementById("result").innerHTML =
        "<hr>Exam Submitted Successfully!<br><br>" +
        "Total Marks: 10<br>" +
        "Your Score: " + score + "/10<br>" +
        "Percentage: " + percentage + "%<br>" +
        message;
    document.querySelectorAll("input,button").forEach(e=>{
        e.disabled = true;
    });
}
</script>
</body>
</html>
