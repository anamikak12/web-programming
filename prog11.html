
<!DOCTYPE html>
<html>
<head>
    <title>Online Examination System</title>
    <style>
        body {
            font-family: Arial;
            background: #eee;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h1 { text-align: center; color: #174477; }
        input[type="text"] {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 12px;
            background: #1769aa;
            color: white;
            border: 0;
            cursor: pointer;
        }
        .question {
            background: #f1f4f8;
            padding: 15px;
            margin: 15px 0;
        }
        .timer {
            text-align: center;
            background: #ffe4d5;
            color: red;
            padding: 12px;
            font-size: 22px;
        }
        #exam, #result { display: none; }
        .submit { background: green; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WEB EXAMINATION</h1>
        <div id="register">
            <h3>Student Registration</h3>
            <input id="name" type="text" placeholder="Student Name">
            <input id="regno" type="text" placeholder="Register Number">
            <p>Total Questions: 10 | Total Marks: 10</p>
            <p>Time Duration: 5 Minutes</p>
            <button onclick="startExam()">Start Examination</button>
        </div>
        <div id="exam">
            <h3>Question Paper</h3>
            <div class="timer">Time Left: <span id="time">10:00</span></div>
            <form id="paper"></form>
            <button class="submit" type="button" onclick="submitExam(false)">Submit Examination</button>
        </div>
        <div id="result">
            <h2>EXAM RESULT</h2>
            <p id="student"></p>
            <p id="registerNo"></p>
            <h2 id="marks"></h2>
            <h3 id="percent"></h3>
            <h3 id="status"></h3>
            <p id="message"></p>
        </div>
    </div>
    <script>
        const questions = [
            ["What is the full form of HTML?", ["Hyper Text Markup Language", "High Text Machine Language", "Hyper Tool Language"], 0],
            ["Which language is used for styling?", ["Java", "CSS", "Python"], 1],
            ["Which language makes web pages interactive?", ["JavaScript", "HTML", "SQL"], 0],
            ["Which tag creates a hyperlink?", ["&lt;link&gt;", "&lt;a&gt;", "&lt;p&gt;"], 1],
            ["Which symbol is used for JavaScript comments?", ["//", "##", "**"], 0],
            ["Who developed Java?", ["Microsoft", "Sun Microsystems", "Google"], 1],
            ["Which is a database language?", ["HTML", "CSS", "SQL"], 2],
            ["Which tag creates a paragraph?", ["&lt;h1&gt;", "&lt;p&gt;", "&lt;br&gt;"], 1],
            ["Which function displays an alert?", ["alert()", "display()", "message()"], 0],
            ["Which CSS property changes text color?", ["font-size", "background", "color"], 2]
        ];
        let remaining = 300, timer, submitted = false;
        function startExam() {
            let name = document.getElementById("name").value.trim();
            let reg = document.getElementById("regno").value.trim();
            if (!name || !reg) {
                alert("Enter Name and Register Number");
                return;
            }
            document.getElementById("register").style.display = "none";
            document.getElementById("exam").style.display = "block";
            document.getElementById("paper").innerHTML = questions.map((q, i) => `
                <div class="question">
                    <b>Q${i + 1}. ${q[0]}</b><br><br>
                    ${q[1].map((option, j) => `
                        <label><input type="radio" name="q${i}" value="${j}"> ${option}</label><br>
                    `).join("")}
                </div>
            `).join("");
            timer = setInterval(() => {
                document.getElementById("time").textContent =
                    String(Math.floor(remaining / 60)).padStart(2, "0") + ":" +
                    String(remaining % 60).padStart(2, "0");
                if (remaining <= 0) {
                    submitExam(true);
                    return;
                }
                remaining--;
            }, 1000);
        }
        function submitExam(auto) {
            if (submitted) return;
            if (!auto && !confirm("Are you sure you want to submit?")) return;
            submitted = true;
            clearInterval(timer);
            let score = questions.reduce((s, q, i) => {
                let answer = document.querySelector(`input[name="q${i}"]:checked`);
                return s + (answer && Number(answer.value) === q[2] ? 1 : 0);
            }, 0);
            document.getElementById("exam").style.display = "none";
            document.getElementById("result").style.display = "block";
            document.getElementById("student").textContent =
                "Student Name: " + document.getElementById("name").value;
            document.getElementById("registerNo").textContent =
                "Register Number: " + document.getElementById("regno").value;
            document.getElementById("marks").textContent = "Marks: " + score + "/10";
            document.getElementById("percent").textContent = "Percentage: " + (score * 10) + "%";
            document.getElementById("status").textContent = score >= 5 ? "PASS" : "FAIL";
            document.getElementById("message").textContent =
                auto ? "Automatically submitted: Time expired." : "Successfully submitted.";
        }
    </script>
</body>
</html>
